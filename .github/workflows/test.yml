# Test automatici a ogni push, su qualsiasi ramo: Python (con servizi finti) e regole di
# Firebase (sull'emulatore, progetto "demo-cns": mai i dati veri).
name: Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa CNS
        run: pip install -e ".[dev]"

      - name: Test Python
        run: python -m pytest -q

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test dell'app (JavaScript)
        run: node --test "web/test/*.test.mjs"

  regole:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - uses: actions/setup-java@v6   # l'emulatore di Firestore è scritto in Java
        with:
          distribution: temurin
          java-version: "21"

      - name: Installa gli strumenti di Firebase
        run: npm ci --no-audit --no-fund

      - name: Test delle regole sull'emulatore
        run: npm test
