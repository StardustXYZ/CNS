# Test automatici a ogni push, su qualsiasi ramo: Python (con servizi finti), app web,
# app Android (analisi e test di Flutter, senza costruire l'APK) e regole di Firebase
# (sull'emulatore, progetto "demo-cns": mai i dati veri).
name: Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa CNS
        run: pip install -e ".[dev]"

      - name: Test Python
        run: python -m pytest -q

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test dell'app (JavaScript)
        run: node --test "web/test/*.test.mjs"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      # La stessa versione di Flutter usata sul PC (mobile/README.md)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Scarica i pacchetti
        run: flutter pub get

      - name: Analisi del codice
        run: flutter analyze

      # Le prove leggono anche tests/fixtures (cartella principale), condivise con Python e web
      - name: Test dell'app Android
        run: flutter test

  regole:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - uses: actions/setup-java@v6   # l'emulatore di Firestore è scritto in Java
        with:
          distribution: temurin
          java-version: "21"

      - name: Installa gli strumenti di Firebase
        run: npm ci --no-audit --no-fund

      - name: Test delle regole sull'emulatore
        run: npm test
