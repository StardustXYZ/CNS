name: cns
description: "CNS - Chi Ni Sentimu: le uscite degli artisti che segui"
publish_to: 'none' # private app, never published on pub.dev

# versionName+versionCode on Android: raise both for every APK given to friends
version: 0.8.1+9

environment:
  sdk: ^3.9.2

dependencies:
  cloud_firestore: ^7.1.0
  file_picker: 11.0.3
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  home_widget: 0.9.2
  http: ^1.6.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
